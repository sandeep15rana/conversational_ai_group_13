[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-engine"
version = "1.1.0"
description = "Dual-layer (short-term + long-term) memory engine for the Group 13 multi-agent system"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.0,<2",
    "pydantic>=2.6,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = ["langchain-openai>=0.2"]
dev = ["pytest>=8", "pytest-cov>=5", "langgraph>=0.2", "langchain-core>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: uses the real all-MiniLM-L6-v2 model (downloads ~80 MB on first run)",
    "orchestration: runs Sandeep's real LangGraph pipeline with the memory nodes",
]
addopts = "-ra"
